/* ─── Routeur ─────────────────────────────────────────────────── */
// Un état = { sec:'pnj'|'lieux'|'enquetes', id:string|null }

function pushState(sec, id){
  const st={sec,id:id||null};
  const hash='#'+sec+(id?'/'+id:'');
  history.pushState(st,'',location.pathname+hash);
  render(st);
}

function replaceState(sec, id){
  const st={sec,id:id||null};
  const hash='#'+sec+(id?'/'+id:'');
  history.replaceState(st,'',location.pathname+hash);
  render(st);
}

window.addEventListener('popstate', e=>{
  render(e.state || parseHash());
});

function parseHash(){
  const h=(location.hash||'#pnj').replace('#','');
  const parts=h.split('/');
  return {sec:parts[0]||'pnj', id:parts[1]||null};
}

function render(st){
  const {sec,id}=st;
  // onglet nav
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('active',['pnj','lieux','enquetes'][i]===sec);
  });
  // sections
  document.getElementById('pnj-view').style.display='none';
  document.getElementById('lieux-view').style.display='none';
  document.getElementById('enquetes-view').style.display='none';

  if(sec==='pnj'){
    document.getElementById('pnj-view').style.display='flex';
    if(id) _showPnjDetail(id);
    else    _showPnjList();
  } else if(sec==='lieux'){
    document.getElementById('lieux-view').style.display='flex';
    if(id) _showLieuDetail(id);
    else    _showLieuList();
  } else {
    document.getElementById('enquetes-view').style.display='flex';
    if(id) _showEnqueteDetail(id);
    else    _showEnqueteList();
  }
}

/* appelé par les boutons de nav */
function navigate(sec){ pushState(sec, null); }

/* ─── Utilitaires ─────────────────────────────────────────────── */
function victimColor(v){if(!v)return'#888';const vl=v.toLowerCase();if(vl.includes('décédé')||vl.includes('morte'))return'#d55b5b';if(vl.includes('coma')||vl.includes('inconscient'))return'#d5855b';if(vl.includes('condamné')||vl.includes('goulag')||vl.includes('détenu'))return'#a07ad5';if(vl.includes('fuite'))return'#d5c05b';if(vl.includes('actif')||vl.includes('libre'))return'#5bd55b';return'#888';}
function initials(n){const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[1][0]).toUpperCase():n.substring(0,2).toUpperCase();}
function avatarBg(cat){const m={police:'#0c2a3a',trafic:'#3a0c0c',sabotage:'#0c2a0c',meurtre:'#2a0c2a',deserteur:'#2a2a0c',souterrain:'#0c0c2a',empoisonnement:'#2a180c',noye:'#0c2a28',neutre:'#222'};return m[cat]||'#222';}

function getFiltered(){
  return PNJ.filter(p=>{
    const s=currentSearch.toLowerCase();
    const ms=!s||p.nom.toLowerCase().includes(s)||p.fonction.toLowerCase().includes(s)||p.enquete.toLowerCase().includes(s)||(p.logement&&(p.logement.adresse.toLowerCase().includes(s)||(p.logement.note&&p.logement.note.toLowerCase().includes(s))));
    let mf=true;
    if(activeFilter){
      if(mode==='alpha') mf=p.nom.trim()[0].toUpperCase()===activeFilter;
      else if(mode==='enquete') mf=p.cat===activeFilter;
      else if(mode==='lieu') mf=p.lieux&&p.lieux.includes(activeFilter);
    }
    return ms&&mf;
  });
}

function buildFilterRow(){
  const row=document.getElementById('filter-row'), alphaBar=document.getElementById('alpha-bar');
  row.innerHTML=''; alphaBar.style.display='none'; row.style.display='flex';
  if(mode==='alpha'){
    row.style.display='none'; alphaBar.style.display='flex';
    alphaBar.innerHTML='<div class="alpha-btn active" onclick="setFilter(\'\',this)">Tout</div>';
    [...new Set(PNJ.map(p=>p.nom.trim()[0].toUpperCase()))].sort().forEach(l=>{
      alphaBar.innerHTML+=`<div class="alpha-btn" onclick="setFilter('${l}',this)">${l}</div>`;
    });
  } else if(mode==='enquete'){
    const cats=[...new Set(PNJ.map(p=>p.cat))].sort();
    row.innerHTML='<div class="filter-chip active" onclick="setFilter(\'\',this)" style="color:#c8a87a;border-color:#c8a87a">Tous</div>';
    cats.forEach(c=>{const col=CAT_COLORS[c]||'#888';const cnt=PNJ.filter(p=>p.cat===c).length;row.innerHTML+=`<div class="filter-chip" onclick="setFilter('${c}',this)" style="color:${col}">${CAT_LABELS[c]||c} <span class="count-badge">${cnt}</span></div>`;});
  } else if(mode==='lieu'){
    const allLieux=[...new Set(PNJ.flatMap(p=>p.lieux||[]))].sort((a,b)=>(LIEU_LABELS[a]||a).localeCompare(LIEU_LABELS[b]||b));
    row.innerHTML='<div class="filter-chip active" onclick="setFilter(\'\',this)" style="color:#c8a87a;border-color:#c8a87a">Tous</div>';
    allLieux.forEach(l=>{const col=LIEU_COLORS[l]||'#888';const cnt=PNJ.filter(p=>p.lieux&&p.lieux.includes(l)).length;row.innerHTML+=`<div class="filter-chip" onclick="setFilter('${l}',this)" style="color:${col}">${LIEU_LABELS[l]||l} <span class="count-badge">${cnt}</span></div>`;});
  }
}

function setMode(m,el){
  mode=m; activeFilter='';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  buildFilterRow(); renderList();
}

function setFilter(val,el){
  activeFilter=val;
  const container=mode==='alpha'?document.getElementById('alpha-bar'):document.getElementById('filter-row');
  container.querySelectorAll('.alpha-btn,.filter-chip').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  if(val&&mode!=='alpha') el.style.borderColor=el.style.color;
  renderList();
}

function renderList(){
  const list=document.getElementById('list-view');
  const filtered=getFiltered();
  if(!filtered.length){list.innerHTML='<div class="no-result">Aucun personnage trouvé</div>';return;}
  let html='', lastKey='';
  filtered.forEach(p=>{
    let key='';
    if(mode==='alpha'&&!currentSearch) key=p.nom.trim()[0].toUpperCase();
    else if(mode==='enquete'&&!currentSearch) key=CAT_LABELS[p.cat]||p.cat;
    if(key&&key!==lastKey){html+=`<div class="section-header">${key}</div>`;lastKey=key;}
    const col=CAT_COLORS[p.cat]||'#888', bg=avatarBg(p.cat);
    const logBadge=p.logement?'<span style="font-size:9px;color:#4a90c8;margin-left:4px">🏠</span>':'';
    html+=`<div class="pnj-item" onclick="pushState('pnj','${p.id}')">
      <div class="avatar" style="background:${bg};color:${col}">${initials(p.nom)}</div>
      <div class="pnj-info"><div class="pnj-name">${p.nom}${logBadge}</div><div class="pnj-role">${p.fonction}</div></div>
      <div class="pnj-badge" style="background:${bg};color:${col}">${CAT_LABELS[p.cat]||''}</div>
    </div>`;
  });
  list.innerHTML=html;
}

document.getElementById('search').addEventListener('input',e=>{
  currentSearch=e.target.value;
  renderList();
});

/* ─── Init ────────────────────────────────────────────────────── */
const initSt=parseHash();
replaceState(initSt.sec, initSt.id);
</script>
</body>
</html>
